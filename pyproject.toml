[project]
name = "priwo"
description = "I/O for common pulsar/FRB data formats."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ujjwal Panda", email = "ujjwapanda97@gmail.com" }]
dependencies = ["numpy", "typing_extensions"]
dynamic = ["version"]

[build-system]
requires = [
  "nanobind >=1.3.2",
  "scikit-build-core >=0.4.3",
  "setuptools_scm >= 8",
  "setuptools >= 64",
]
build-backend = "scikit_build_core.build"

[tool.cibuildwheel]
build-verbosity = 1

[tool.scikit-build]
wheel.py-api = "cp312"
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
sdist.include = ["python/priwo/_version.py"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "python/priwo/_version.py"
